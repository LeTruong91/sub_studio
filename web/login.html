<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1c1c1d;
            color: #fff;
            font-family: "Segoe UI", sans-serif;
        }

        .login-box {
            width: 400px;
            background: #0000002b;
            padding: 30px 24px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #000000;
        }

        .login-box h2 {
            margin: 0 0 20px;
            font-size: 16px;
            color: #b0b4b9;
            font-weight: 500;
        }

        .login-box input[type="text"],
        .login-box input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #2c313c;
            border-radius: 6px;
            background: #232323;
            color: #c1c1c1;
            box-sizing: border-box;
            outline: none;
        }

        .login-box input:focus {
            border-color: #4f9dff;
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
            font-size: 13px;
            color: #ccc;
        }

        .login-box button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #0866ff;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-box button:hover {
            background: #003791;
        }

        .login-box button:disabled {
            cursor: not-allowed;
        }

        #err {
            color: #ff6b6b;
            font-size: 13px;
            min-height: 18px;
            margin-top: 10px;
        }
        .quit-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .quit-overlay.show { display: flex; }
        .quit-box {
            width: 320px;
            background: #0b1230;
            border: 1px solid #2c313c;
            border-radius: 10px;
            padding: 18px 16px;
            text-align: center;
        }
        .quit-box p { margin: 0 0 16px; font-size: 14px; color: #edeff2; }
        .quit-actions { display: flex; gap: 8px; }
        .quit-actions button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #fff;
        }
        .quit-cancel { background: #2c313c; }
        .quit-ok { background: #b42318; }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Tên đăng nhập" autocomplete="username">
        <input type="password" id="password" placeholder="Mật khẩu" autocomplete="current-password">
        <div class="remember-row">
            <input type="checkbox" id="remember">
            <label for="remember">Ghi nhớ đăng nhập</label>
        </div>
        <button id="loginBtn" onclick="doLogin()">Login</button>
        <div id="err"></div>
    </div>
    <div class="quit-overlay" id="quitOverlay">
        <div class="quit-box">
            <p>Bạn có chắc chắn muốn tắt ứng dụng?</p>
            <div class="quit-actions">
                <button type="button" class="quit-cancel" id="quitCancel">Hủy</button>
                <button type="button" class="quit-ok" id="quitOk">Tắt</button>
            </div>
        </div>
    </div>
    
    <script>
        async function fillRemembered() {
            try {
                const info = await window.pywebview.api.get_remembered();
                if (info && info.remember) {
                    document.getElementById("username").value = info.username || "";
                    document.getElementById("password").value = info.password || "";
                    document.getElementById("remember").checked = true;
                }
            } catch (e) { }
            document.getElementById("username").focus();
        }

        async function doLogin() {
            const btn = document.getElementById("loginBtn");
            const err = document.getElementById("err");
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const remember = document.getElementById("remember").checked;

            if (!username || !password) {
                err.innerText = "Vui lòng nhập đầy đủ thông tin.";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Đang login";
            err.innerText = "";

            try {
                const result = await window.pywebview.api.login(username, password, remember);
                if (!result.ok) {
                    err.innerText = result.message;
                    btn.disabled = false;
                    btn.innerText = "Login";
                }
                // nếu ok=true, Python đã tự load_url sang index.html
            } catch (e) {
                err.innerText = "Lỗi kết nối: " + e;
                btn.disabled = false;
                btn.innerText = "Login";
            }
        }

        document.addEventListener("keydown", (e) => {
            if (document.getElementById("quitOverlay").classList.contains("show")) return;
            if (e.key === "Enter") doLogin();
        });
        window.addEventListener("pywebviewready", fillRemembered);

        function askQuitApp() {
            const overlay = document.getElementById("quitOverlay");
            if (overlay.classList.contains("show")) return;
            overlay.classList.add("show");
            document.getElementById("quitCancel").onclick = () => {
                overlay.classList.remove("show");
                if (window.pywebview && window.pywebview.api.quit_prompt_dismissed) {
                    window.pywebview.api.quit_prompt_dismissed();
                }
            };
            document.getElementById("quitOk").onclick = () => {
                overlay.classList.remove("show");
                if (window.pywebview && window.pywebview.api.quit_app) {
                    window.pywebview.api.quit_app();
                }
            };
        }
        window.__askQuitApp = askQuitApp;
        setInterval(async () => {
            try {
                if (!window.pywebview || !window.pywebview.api.consume_quit_prompt) return;
                const need = await window.pywebview.api.consume_quit_prompt();
                if (need) askQuitApp();
            } catch (e) {}
        }, 200);
    </script>
</body>

</html>
