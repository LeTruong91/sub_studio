<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:#1c1c1d;
        color: #fff;
        font-family: "Segoe UI", sans-serif;
    }
    .spinner {
        width: 48px;
        height: 48px;
        border: 5px solid #444;
        border-top-color: #4f9dff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    #msg {
        font-size: 15px;
        color: #ccc;
    }
</style>
</head>
<body class="rs-scope">
    <div class="spinner"></div>
    <div id="msg">Đang khởi tạo server...</div>
</body>
</html>
